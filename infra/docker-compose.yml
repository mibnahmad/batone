name: batione

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: batione-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: batione
      POSTGRES_PASSWORD: batione
      POSTGRES_DB: batione
    ports:
      - "55432:5432"
    volumes:
      - batione-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batione -d batione"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: batione-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  batione-pgdata:
